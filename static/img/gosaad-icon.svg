<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">GoSAAD Text Only Icon</title>
  <desc id="desc">Selected GoSAAD text-only icon based on Concept B, with dark Go and blue SAAD.</desc>
  <defs>
    <linearGradient id="surface" x1="74" y1="64" x2="438" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="12" y="10" width="488" height="492" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1d4ed8" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#f7fbff"/>
  <g filter="url(#shadow)">
    <rect x="58" y="70" width="396" height="372" rx="96" fill="url(#surface)" stroke="#bfdbfe" stroke-width="12"/>
  </g>
  <text
    x="256"
    y="286"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
    font-size="95"
    font-weight="900"
    letter-spacing="-2">
    <tspan fill="#020617">Go</tspan><tspan fill="#1f7af8">SAAD</tspan>
  </text>
</svg>
